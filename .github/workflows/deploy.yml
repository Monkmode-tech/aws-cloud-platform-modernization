name: Deploy approved WordPress image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wordpress-deployment
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    environment: aws-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      TASK_FAMILY: ${{ vars.TASK_FAMILY }}
      EXECUTION_ROLE_ARN: ${{ vars.EXECUTION_ROLE_ARN }}
      TASK_ROLE_ARN: ${{ vars.TASK_ROLE_ARN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: GitHubWordPressDeployment
      - run: python -m pip install -r requirements.txt
      - run: python scripts/deploy_image.py
